<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>이력서 만들기 · 나루</title>
    <link rel="stylesheet" href="../shared/builder.css" />
  </head>
  <body>
    <header>
      <h1>이력서 만들기</h1>
      <p>경력, 학력, 기술과 연락처를 담은 이력서 홈페이지예요. 화면에서도, 인쇄해도 깔끔해요. 다 고치면 ‘나루에 띄우기’를 누르세요.</p>
    </header>
    <div class="layout">
      <section class="preview" aria-label="미리 보기">
        <iframe id="preview" title="미리 보기" sandbox></iframe>
      </section>
      <form id="form" class="form">
        <label>이름 <input name="name" maxlength="40" placeholder="나루" autocomplete="name" /></label>
        <label>하는 일 <input name="role" maxlength="60" placeholder="프론트엔드 개발자" /></label>
        <label>소개 <textarea name="summary" rows="4" maxlength="1500" placeholder="어떤 일을 해 왔고, 무엇을 잘하는지 짧게 적어요."></textarea></label>
        <fieldset>
          <legend>사진</legend>
          <div class="photo">
            <img id="photo-thumb" alt="" />
            <div>
              <label class="button secondary">
                사진 고르기
                <input id="photo" type="file" accept="image/*" hidden />
              </label>
              <button id="photo-remove" type="button" class="link" hidden>사진 빼기</button>
            </div>
          </div>
          <p class="help">넣지 않아도 돼요. 사진은 크기를 줄이고, 찍은 곳 같은 정보는 지운 뒤 올려요.</p>
        </fieldset>
        <fieldset>
          <legend>연락처</legend>
          <div class="stack">
            <label>이메일 <input name="email" type="email" maxlength="120" autocomplete="email" /></label>
            <label>전화 <input name="phone" type="tel" maxlength="20" autocomplete="tel" /></label>
            <label>사는 곳 <input name="location" maxlength="40" placeholder="서울" /></label>
          </div>
          <p class="help">이력서는 누구나 볼 수 있어요. 보여 줄 연락처만 적으세요.</p>
          <ol id="links" class="entries"></ol>
          <button type="button" class="link" data-add="links">+ 링크 추가</button>
        </fieldset>
        <fieldset>
          <legend>경력</legend>
          <ol id="experience" class="entries"></ol>
          <button type="button" class="link" data-add="experience">+ 경력 추가</button>
        </fieldset>
        <fieldset>
          <legend>학력</legend>
          <ol id="education" class="entries"></ol>
          <button type="button" class="link" data-add="education">+ 학력 추가</button>
        </fieldset>
        <label>기술 <textarea name="skills" rows="3" maxlength="1000" placeholder="JavaScript, 디자인, 영어"></textarea></label>
        <fieldset>
          <legend>강조색</legend>
          <div id="accents" class="accents"></div>
        </fieldset>
        <button id="apply" type="button" class="button">나루에 띄우기</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </div>
    <script src="page.js"></script>
    <script type="module" src="builder.js"></script>
  </body>
</html>
