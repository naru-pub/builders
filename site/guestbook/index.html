<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>방명록 만들기 · 나루</title>
    <link rel="stylesheet" href="../shared/maker.css" />
  </head>
  <body>
    <header>
      <h1>방명록 만들기</h1>
      <p>방문자가 이름과 한마디를 남기는 방명록이에요. 남긴 글은 내 사이트의 데이터베이스에 쌓이고, 관리에서 지울 수 있어요. 다 고치면 ‘나루에 띄우기’를 누르세요.</p>
    </header>
    <div class="layout">
      <section class="preview" aria-label="미리 보기">
        <iframe id="preview" title="미리 보기" sandbox></iframe>
      </section>
      <form id="form" class="form">
        <fieldset>
          <legend>둘 곳</legend>
          <div class="choices">
            <label><input type="radio" name="place" value="folder" /> 방명록 페이지로</label>
            <label><input type="radio" name="place" value="home" /> 사이트 첫 페이지로</label>
          </div>
          <p class="help" id="place-help"></p>
        </fieldset>
        <fieldset>
          <legend>강조색</legend>
          <div id="accents" class="accents"></div>
          <p class="help">버튼에 마우스를 올리거나 키보드로 고를 때만 보여요.</p>
        </fieldset>
        <p class="help">
          띄우면 사이트에 <code>guestbook</code> 컬렉션이 생겨요. 누구나 읽고 새 글을 남길 수 있지만,
          고치거나 지우는 건 사이트 주인만 할 수 있어요. 데이터베이스를 쓰는 사이트에서 동작해요.
        </p>
        <button id="apply" type="button" class="button">나루에 띄우기</button>
        <p id="status" class="status" role="status"></p>
      </form>
    </div>
    <script src="page.js"></script>
    <script type="module" src="maker.js"></script>
  </body>
</html>
