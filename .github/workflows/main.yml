name: main
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/
  # Publishes site/ to builders.naru.pub, only from main and only once the
  # tests pass. Naru checks the workflow's GitHub OIDC token against the
  # target registered for this repository and branch on naru.pub/github; it
  # deletes what an earlier deploy published and this commit no longer has.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: naru-pub/actions/deploy@v1
        with:
          site: builders
          dir: site
          target: /
